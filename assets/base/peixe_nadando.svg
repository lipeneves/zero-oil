<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="72" viewBox="0 0 96 72">
  <title>peixe_nadando.svg</title>
  <!-- peixe nadando debaixo d'agua: silhueta escura (sem contorno, para parecer
       submersa) e a barbatana laranja de fora, no estilo cartoon do barco -->
  <g fill="#0f231e" fill-opacity="0.55">
    <ellipse cx="50" cy="50" rx="27" ry="8.5"/>
    <path d="M27 50 L8 41 Q12 50 8 59 Z"/>
  </g>
  <!-- barbatana -->
  <path d="M39 50 Q40 33 49 27 Q56 36 58 50 Z" fill="#ff8c1e" stroke="#20242b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M44 44 Q45 36 48.5 32" fill="none" stroke="#ffc98a" stroke-width="3.5" stroke-linecap="round"/>
</svg>
