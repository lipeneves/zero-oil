<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <title>boia.svg</title>
  <!-- boia de sinalizacao (obstaculo), no estilo cartoon do barco: flutuador redondo
       vermelho na agua, torrezinha vermelha com faixa branca, luz amarela em cima e
       contorno escuro (da mesma grossura do barco na tela). O jogo esconde os 18%
       de baixo da imagem (a parte dentro da agua), entao o flutuador e cortado na
       linha y = 79. -->
  <g stroke="#20242b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- haste e luz em cima (atras da torre) -->
    <path d="M48 22 L48 14" fill="none"/>
    <circle cx="48" cy="11" r="6" fill="#ffd23c"/>
    <!-- flutuador (meio afundado) -->
    <path d="M16 80 Q16 62 48 62 Q80 62 80 80 Z" fill="#d42a2a"/>
    <!-- torre -->
    <path d="M38 22 L58 22 L65 68 Q48 73 31 68 Z" fill="#ef3b3b"/>
  </g>
  <!-- faixa branca (acompanha a curva da torre) -->
  <path d="M35.6 38 Q48 41 60.4 38 L62.3 51 Q48 55 33.7 51 Z" fill="#f5f7fa"/>
  <!-- brilhos: na torre, no flutuador e na luz -->
  <path d="M40 27 L35 62" fill="none" stroke="#ff9a9a" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M24 72 Q28 67 36 66" fill="none" stroke="#ff8080" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="45.8" cy="9" r="1.8" fill="#ffffff" opacity="0.9"/>
  <!-- contorno da torre de novo por cima da faixa -->
  <path d="M38 22 L58 22 L65 68 Q48 73 31 68 Z" fill="none" stroke="#20242b" stroke-width="3" stroke-linejoin="round"/>
</svg>
