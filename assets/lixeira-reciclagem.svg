<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#256f3f"/>
      <stop offset="0.15" stop-color="#48bb78"/>
      <stop offset="0.35" stop-color="#38a169"/>
      <stop offset="0.75" stop-color="#2d8a4e"/>
      <stop offset="1" stop-color="#1e5c33"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d8a4e"/>
      <stop offset="0.4" stop-color="#48bb78"/>
      <stop offset="0.6" stop-color="#38a169"/>
      <stop offset="1" stop-color="#22543d"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e2e2"/>
      <stop offset="0.12" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#f3f3f3"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <radialGradient id="goldGrad" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.55" stop-color="#eab308"/>
      <stop offset="1" stop-color="#a16207"/>
    </radialGradient>
    <g id="arrow">
      <path d="M -27 -18 L -12 -44 Q 0 -62 12 -44 L 18 -33" fill="none" stroke="#38a169" stroke-width="17"/>
      <path d="M 36 -42 L 32 -4 L 2 -24 Z" fill="#38a169"/>
    </g>
  </defs>

  <g stroke="#173f25" stroke-width="4" stroke-linejoin="round">
    <!-- corpo -->
    <path d="M70 190 L70 540 A130 18 0 0 0 330 540 L330 190 Z" fill="url(#bodyGrad)"/>
    <!-- anel abaixo da tampa -->
    <path d="M70 200 L70 226 A130 16 0 0 0 330 226 L330 200 Z" fill="#256f3f" stroke-width="3"/>
    <!-- faixa branca -->
    <path d="M70 290 A130 16 0 0 0 330 290 L330 440 A130 16 0 0 1 70 440 Z" fill="url(#labelGrad)" stroke-width="3"/>

    <!-- haste e bola -->
    <rect x="196" y="36" width="8" height="22" fill="#9ca3af" stroke-width="2"/>
    <circle cx="200" cy="28" r="12" fill="url(#goldGrad)" stroke="#713f12" stroke-width="2"/>

    <!-- tampa cônica -->
    <path d="M200 56 L48 186 A152 18 0 0 0 352 186 Z" fill="url(#coneGrad)"/>
    <path d="M200 56 L150 202 M200 56 L260 201" stroke="#2d8a4e" stroke-width="2" fill="none"/>
    <!-- aba da tampa -->
    <path d="M48 186 A152 18 0 0 0 352 186 L352 194 A152 18 0 0 1 48 194 Z" fill="#22543d" stroke-width="3"/>
  </g>

  <!-- brilhos -->
  <path d="M200 64 L120 196" stroke="#9ae6b4" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <rect x="92" y="236" width="12" height="44" rx="6" fill="#9ae6b4" opacity="0.5"/>
  <rect x="92" y="458" width="12" height="80" rx="6" fill="#9ae6b4" opacity="0.5"/>

  <!-- símbolo de reciclagem -->
  <g transform="translate(200 372)">
    <use href="#arrow"/>
    <use href="#arrow" transform="rotate(120)"/>
    <use href="#arrow" transform="rotate(240)"/>
  </g>
</svg>
