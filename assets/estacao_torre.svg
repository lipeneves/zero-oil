<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="500" viewBox="0 0 240 500">
  <title>estacao_torre.svg</title>
  <!-- torre de reciclagem no estilo cartoon do barco: cores chapadas, contorno
       grafite, sombra do lado direito e brilho do esquerdo (luz vindo da esquerda).
       E um cilindro: igual de qualquer lado. O pe (y ~ 484) encosta na agua.
       O corpo e de vidro: o jogo desenha o oleo atras dele, do fundo (y 470)
       ate a tampa (y ~ 120), conforme o oleo do rio e descarregado. -->

  <!-- corpo de vidro -->
  <path d="M26 100 L26 470 A94 14 0 0 0 214 470 L214 100 Z" fill="#bfe9f7" fill-opacity="0.3"/>
  <path d="M172 100 L214 100 L214 470 A94 14 0 0 1 172 481.7 Z" fill="#6fb4cc" fill-opacity="0.3"/>
  <!-- fundo do tanque visto pelo vidro -->
  <path d="M26 470 A94 14 0 0 1 214 470" fill="none" stroke="#20242b" stroke-opacity="0.35" stroke-width="3"/>
  <!-- reflexos do vidro -->
  <path d="M44 124 L44 210 M44 392 L44 434" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="8" stroke-linecap="round"/>
  <path d="M60 130 L60 168" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <path d="M196 140 L196 420" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/>
  <!-- contorno do corpo -->
  <path d="M26 100 L26 470 A94 14 0 0 0 214 470 L214 100 Z" fill="none" stroke="#20242b" stroke-width="5.5" stroke-linejoin="round"/>

  <!-- tampa reta em cima (sem telhado), de vidro como o corpo -->
  <ellipse cx="120" cy="100" rx="94" ry="14" fill="#bfe9f7" fill-opacity="0.45"/>
  <path d="M48 96 Q70 90 98 89" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="120" cy="100" rx="94" ry="14" fill="none" stroke="#20242b" stroke-width="5.5"/>
</svg>
